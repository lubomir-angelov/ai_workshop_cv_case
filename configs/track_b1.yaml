# Track B1: VideoMAE Window Classifier Configuration
# Used by: pickup-putdown track-b1-train, pickup-putdown track-b1-infer
#
# This file configures the VideoMAE-based sliding window classifier
# for pickup/putdown event detection (Task 12).

# =============================================================================
# MODEL CONFIGURATION
# =============================================================================
model:
  # HuggingFace model name or path
  model_name: "MCG-NJU/videomae-base"
  num_classes: 3  # background, pickup, putdown

  # Backbone freezing strategy
  # CVAT branch (annotation-conditioned, not reproduced here): unfreezing the last 2
  # blocks beat the frozen probe on validation (event F1 @ tIoU 0.3 reported as 0.806
  # vs 0.585; other documents report 0.783, see docs/TRACK_B1_INTEGRATION.md).
  # Requires the pixel path in train_track_b1.py; embeddings are frozen-only.
  freeze_backbone: true
  unfreeze_last_n_blocks: 2  # Fine-tune last N transformer blocks

  # A pretrained backbone needs a far smaller step than the head. Training with one
  # rate for both leaves the head barely trained at backbone LR.
  backbone_lr: 0.00005

# =============================================================================
# WINDOW CONFIGURATION (Shared by training and inference)
# =============================================================================
window:
  # Window extraction parameters
  # 1.5 s / 0.25 s beat 2.5 s / 0.5 s on validation at every tIoU, and cut boundary
  # MAE from 1.35 s to 0.48 s. Events have a 0.9 s median, so a 2.5 s window is wider
  # than the thing it is trying to localise.
  window_duration_s: 1.5    # Duration of each sliding window
  window_stride_s: 0.25     # Stride between windows (for inference)
  num_frames: 16            # Frames per window (VideoMAE requirement)

  # Image preprocessing
  image_size: [224, 224]    # Target size after crop/resize
  crop_margin: 0.15         # Margin around actor bounding box

# Per-input-mode preprocessing (merged over `window` by build_track_b1_dataset.py and
# recorded in each dataset's build_metadata.json; every downstream script reads it
# from there, so cache, training, inference and diagnostics cannot disagree).
#   annotation: crop fixed per candidate from the CVAT box (per-candidate cache)
#   deployment: crop per window from the pose person box + shelf region (pose route)
# The two produce different inputs for the same moment; compare model variants only
# within one mode. The historical frozen-head baseline used deployment preprocessing
# with 2.5 s / 0.5 s windows.
input_modes:
  annotation:
    crop_scope: "candidate"
    resize_interpolation: "area"
  deployment:
    crop_scope: "window"
    resize_interpolation: "linear"

# =============================================================================
# TRAINING CONFIGURATION
# =============================================================================
training:
  # Optimizer
  learning_rate: 0.001   # head; see model.backbone_lr for unfrozen encoder blocks
  weight_decay: 0.01

  # Scheduler
  scheduler_type: "cosine"  # "cosine" or "step"
  warmup_epochs: 2

  # Training loop
  num_epochs: 50
  batch_size: 8
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0

  # Early stopping
  early_stopping_patience: 7
  early_stopping_min_delta: 0.001

  # Class weighting (handles imbalanced data)
  use_class_weights: true

  # Gate B: Tiny overfit test (must pass before full training)
  gate_b_samples: 4
  gate_b_epochs: 20
  gate_b_target_accuracy: 0.95

  # Checkpointing
  save_best_only: true
  checkpoint_metric: "f1_macro"  # Metric to track for best model

  # Reproducibility
  seed: 42

# =============================================================================
# INFERENCE CONFIGURATION
# =============================================================================
inference:
  # Selected by the CVAT branch on its validation split only, by the mean of event F1
  # at tIoU 0.3 and 0.5, for its annotation-conditioned fine-tuned model (reported
  # F1@0.3 = 0.806, F1@0.5 = 0.746; unverified here). Re-tune per model and input mode
  # with scripts/tune_track_b1_thresholds.py.
  pickup_threshold: 0.40
  putdown_threshold: 0.45

  # Temporal smoothing
  smoothing_window: 5  # Number of adjacent predictions to average (must be odd)

  # Same-type merging (NEVER merges pickup with putdown)
  same_type_merge_gap_s: 0.75  # Merge same-type regions if gap < this
  min_event_duration_s: 0.3    # Discard events shorter than this

  # How a run of above-threshold windows becomes an event interval.
  #   window_span    — first window start to last window end
  #   window_centers — first to last window centre, widened by half a stride
  # Events here have a 0.9 s median against a 2.5 s window, so window_span cannot
  # emit an interval tighter than one window and caps tIoU near 0.36. Switching to
  # centres raised validation F1 at tIoU 0.3 from 0.35 to 0.65 with no model change.
  boundary_mode: "window_centers"

  # Output
  model_name: "layer1_track_b1_videomae_window_v1"

  # Processing
  batch_size: 8
  num_workers: 4        # DataLoader workers for parallel CPU frame decoding
  pin_memory: true      # Faster CPU→GPU transfer (page-locked memory)
  prefetch_factor: 2    # Batches to prefetch per worker (buffer depth)

# =============================================================================
# ANNOTATION SOURCE
# =============================================================================
# Ground truth comes from CVAT source-video annotation, imported by
# scripts/build_track_b1_dataset.py. Actor crop boxes come from the annotation
# tracks themselves; no pose pipeline output is required for these clips.
annotation:
  # S3 mirror of the export (scripts/download_all_staged.sh); a fresh
  # scripts/export_cvat_annotations.py run writes .local/cvat_exports/<date>.
  export_dir: ".local/annotations/cvat/2026-09-09/raw"

  # Held-box padding around each event. This is where hard negatives come from:
  # without it a background window finds no box, falls back to the full 4K frame,
  # and the crop size alone would separate the classes.
  context_pad_s: 3.0

  # Keep intervals still marked "draft" in CVAT (13 of 261 at time of writing).
  accepted_only: false

  # Splits are by recording day, from an explicit registry (default registry in
  # the file). 20260526 is not an untouched test day; see the registry caveat.
  split_registry_file: "configs/track_b1_splits.yaml"

  # Windows synthesised per completed-but-empty clip (verified negatives).
  negative_windows_per_clip: 12

# =============================================================================
# DATA PATHS (Override via CLI or environment)
# =============================================================================
data:
  # Built by scripts/build_track_b1_dataset.py, one directory per input mode. Each
  # holds events/ignore_intervals/clips/candidates/window_manifest parquet files,
  # actor_tracks/ (annotation) or pose_tracks/ (deployment), and build_metadata.json.
  dataset_dir: ".local/track_b1_dataset"                # --input-mode annotation
  deployment_dataset_dir: ".local/track_b1_dataset_deploy"  # --input-mode deployment
  # Pose candidates/tracks for deployment mode (scripts/prepare_track_b1_data.py).
  pose_data_dir: ".local/track_b1_data"

  video_dir: ".local/source_videos"

  # Deployment mode: lazily filled per-window uint8 crop cache (TrackB1Dataset).
  frame_cache_dir: ".local/track_b1_frame_cache"

  # Built by scripts/build_track_b1_cache.py — decoding 4K windows by seeking is
  # about four orders of magnitude too slow to train on.
  cache_dir: ".local/track_b1_cache"

  # Built by scripts/precompute_track_b1_embeddings.py — valid only while the
  # backbone is frozen.
  embeddings_dir: ".local/track_b1_embeddings"

  # Output
  checkpoint_dir: ".local/track_b1_run/checkpoints"
  predictions_dir: ".local/track_b1_run/predictions"

# =============================================================================
# DEVICE CONFIGURATION
# =============================================================================
device:
  # "auto", "cuda", "mps", or "cpu"
  type: "auto"

  # Mixed precision (for faster training on compatible GPUs)
  use_amp: false

  # Number of data loader workers
  num_workers: 4
  pin_memory: true
